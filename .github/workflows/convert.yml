name: Convert CFST CSV

on:
  push:
    branches: [main]
    paths:
      - result.csv
      - result_company.csv
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Convert result.csv + result_company.csv to script-compatible format
        run: |
          {
            echo "IP,端口,TLS,数据中心,速度"
            # 家庭网络: result.csv 前 10 个有效数据(排除地区码 N/A)
            awk -F',' '{sub(/\r$/,"")} NR>1 && NF>=7 && $7!="N/A" {print $1",443,TRUE,"$7","$6; n++; if(n>=10) exit}' result.csv
            # 公司网络: result_company.csv 前 10 个有效数据(排除地区码 N/A),不存在则跳过
            if [ -f result_company.csv ]; then
              awk -F',' '{sub(/\r$/,"")} NR>1 && NF>=7 && $7!="N/A" {print $1",443,TRUE,"$7","$6; n++; if(n>=10) exit}' result_company.csv
            fi
          } | awk -F',' 'NR==1 || !seen[$1]++' > result_cfst.csv
          echo "转换完成: $(wc -l < result_cfst.csv) 行"

      - name: Commit converted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result_cfst.csv
          git diff --cached --quiet && echo "无变化,跳过提交" && exit 0
          git commit -m "chore: auto-convert result.csv to result_cfst.csv"
          git push
